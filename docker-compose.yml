services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: banking
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6381:6379"]

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5673:5672", "15673:15672"]

volumes:
  pgdata:
