x-env: &env
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
  SECRET_KEY: dev-secret-change-me
  JWT_SECRET_KEY: dev-only-jwt-secret-change-me-32-bytes-min
  APP_ENV: development
  LOG_FORMAT: json

# Dev-only passwords. In production both come from a secret manager.
x-owner-db: &owner-db
  DATABASE_URL: postgresql+psycopg://bank:bank@postgres:5432/banking

x-runtime-db: &runtime-db
  DATABASE_URL: postgresql+psycopg://bank_app:bank_app_dev_pw@postgres:5432/banking

x-app: &app
  build: .
  image: banking-api:dev
  profiles: ["app"]

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: banking
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d banking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5673:5672", "15673:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  migrate:
    <<: *app
    environment:
      <<: [*env, *owner-db]
    command: ["flask", "db", "upgrade"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  db-roles:
    image: postgres:15
    profiles: ["app"]
    restart: "no"
    environment:
      PGPASSWORD: bank
    volumes:
      - ./db:/db:ro
    command:
      - psql
      - -h
      - postgres
      - -U
      - bank
      - -d
      - banking
      - -v
      - ON_ERROR_STOP=1
      - -v
      - app_password=bank_app_dev_pw
      - -f
      - /db/roles.sql
      - -f
      - /db/grants.sql
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    environment:
      <<: [*env, *runtime-db]
    ports: ["8000:8000"]
    depends_on:
      db-roles:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    environment:
      <<: [*env, *runtime-db]
    command: ["celery", "-A", "celery_worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      db-roles:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  relay:
    <<: *app
    environment:
      <<: [*env, *runtime-db]
    command: ["flask", "outbox-relay"]
    depends_on:
      db-roles:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  pgdata: