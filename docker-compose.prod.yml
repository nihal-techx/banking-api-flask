name: banking

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ghcr.io/nihal-techx/banking-api-flask:${IMAGE_TAG:-latest}
  restart: unless-stopped
  logging: *logging

x-app-env: &app-env
  APP_ENV: production
  LOG_FORMAT: json
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.prod}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env.prod}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}@redis:6379/0
  RABBITMQ_URL: amqp://bankmq:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env.prod}@rabbitmq:5672//
  TRUSTED_PROXY_COUNT: "1"
  WEB_CONCURRENCY: "2"

# Migrations run as the database owner. Everything else runs as the restricted bank_app role.
x-owner-db: &owner-db
  DATABASE_URL: postgresql+psycopg://bank:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/banking

x-runtime-db: &runtime-db
  DATABASE_URL: postgresql+psycopg://bank_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env.prod}@postgres:5432/banking

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    logging: *logging
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "log_min_duration_statement=500"]
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: banking
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d banking"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *logging
    # Append-only persistence: revoked tokens must survive a restart.
    # noeviction: running out of memory must fail writes (fail closed), never drop revocations.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 300m

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: bankmq
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env.prod}
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 700m

  migrate:
    <<: *app
    restart: "no"
    command: ["flask", "db", "upgrade"]
    environment:
      <<: [*app-env, *owner-db]
    depends_on:
      postgres:
        condition: service_healthy

  db-roles:
    image: postgres:15
    restart: "no"
    logging: *logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db:/db:ro
    command:
      - psql
      - -h
      - postgres
      - -U
      - bank
      - -d
      - banking
      - -v
      - ON_ERROR_STOP=1
      - -v
      - app_password=${APP_DB_PASSWORD}
      - -f
      - /db/roles.sql
      - -f
      - /db/grants.sql
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    environment:
      <<: [*app-env, *runtime-db]
    depends_on:
      db-roles:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600m

  worker:
    <<: *app
    command: ["celery", "-A", "celery_worker.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    environment:
      <<: [*app-env, *runtime-db]
    healthcheck:
      disable: true
    depends_on:
      db-roles:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 500m

  relay:
    <<: *app
    command: ["flask", "outbox-relay"]
    environment:
      <<: [*app-env, *runtime-db]
    healthcheck:
      disable: true
    depends_on:
      db-roles:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 250m

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env.prod}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 150m

volumes:
  pgdata:
  redisdata:
  mqdata:
  caddy_data:
  caddy_config: