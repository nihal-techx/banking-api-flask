name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lint.txt
      - run: pip install -r requirements-lint.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bank
          POSTGRES_PASSWORD: bank
          POSTGRES_DB: banking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bank -d banking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://bank:bank@localhost:5432/banking_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests (fails under the coverage threshold in .coveragerc)
        run: pytest --cov --cov-report=term-missing --cov-report=html -q
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: banking-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          COMMON="-e DATABASE_URL=postgresql+psycopg://x:x@127.0.0.1:5432/x -e REDIS_URL=redis://127.0.0.1:6379/0 -e RABBITMQ_URL=amqp://guest:guest@127.0.0.1:5672//"
          # 1. Secure by default: the image must refuse to start with the development secrets.
          if docker run --rm $COMMON banking-api:ci python -c "from app import create_app; create_app()"; then
            echo "image booted with default secrets"
            exit 1
          fi
          # 2. With real secrets it starts. Liveness works, readiness reports the missing database.
          docker run -d --name api -p 8000:8000 $COMMON \
            -e SECRET_KEY=ci-only-secret-key-0123456789abcdef \
            -e JWT_SECRET_KEY=ci-only-jwt-secret-0123456789abcdef \
            banking-api:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/health
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready)" = "503"
          curl -sf -H "X-Request-ID: ci-smoke-0001" http://127.0.0.1:8000/openapi/openapi.json > /dev/null
          # 3. Production logs are structured and carry the request id.
          docker logs api 2>&1 | grep -q '"request_id": "ci-smoke-0001"'
          # 4. The container must not run as root.
          test "$(docker exec api id -u)" = "10001"
          docker logs api
